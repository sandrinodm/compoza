name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(version, /^\d+\.\d+\.\d+$/, 'Only stable versions can be published');
          assert.equal(process.env.GITHUB_REF, `refs/tags/v${version}`, 'Select the tag matching package.json');
          NODE
          git merge-base --is-ancestor HEAD origin/main
          count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --commit "$(git rev-parse HEAD)" --event push --status success --limit 100 --json databaseId --jq 'length')
          test "$count" -gt 0 || { echo 'This commit needs a successful CI run on main.'; exit 1; }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
        with:
          version: 12.16.1
      - name: Install npm with trusted publishing support
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Build and pack with resolved catalog dependencies
        run: pnpm pack --out "$RUNNER_TEMP/compoza.tgz"
      - name: Test the exact package to publish
        run: pnpm test:package "$RUNNER_TEMP/compoza.tgz"
      - name: Publish with npm trusted publishing
        working-directory: ${{ runner.temp }}
        run: npm publish "$RUNNER_TEMP/compoza.tgz" --access public --provenance --ignore-scripts
